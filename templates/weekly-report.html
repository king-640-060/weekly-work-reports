<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作周报（YYYY.MM.DD—YYYY.MM.DD）</title>
</head>
<body style="margin: 24px; background-color: #ffffff; color: #222222; font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', SimSun, Arial, sans-serif; font-size: 14px; line-height: 1.75;">
  <!-- 浏览器中全选并复制页面正文，粘贴到邮箱富文本正文；不要复制 HTML 源代码。 -->
  <div style="width: 100%; max-width: 960px; margin: 0 auto;">
    <h1 style="margin: 0 0 20px 0; font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', SimSun, Arial, sans-serif; font-size: 22px; line-height: 1.5; font-weight: bold;">工作周报（YYYY.MM.DD—YYYY.MM.DD）</h1>
    <h2 style="margin: 0 0 12px 0; font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', SimSun, Arial, sans-serif; font-size: 18px; line-height: 1.5; font-weight: bold;">一、个人项目概述</h2>
    <table width="100%" border="1" cellspacing="0" cellpadding="0" style="width: 100%; border: 1px solid #555555; border-collapse: collapse; table-layout: fixed; font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', SimSun, Arial, sans-serif; font-size: 14px; line-height: 1.75;">
      <colgroup>
        <col width="18%" style="width: 18%;">
        <col width="53%" style="width: 53%;">
        <col width="29%" style="width: 29%;">
      </colgroup>
      <thead>
        <tr>
        <th scope="col" width="18%" style="border: 1px solid #555555; padding: 12px; vertical-align: top; text-align: left; font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', SimSun, Arial, sans-serif; font-size: 14px; line-height: 1.75; color: #222222; overflow-wrap: break-word; width: 18%; background-color: #f2f4f7; font-weight: bold;">项目名称</th>
        <th scope="col" width="53%" style="border: 1px solid #555555; padding: 12px; vertical-align: top; text-align: left; font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', SimSun, Arial, sans-serif; font-size: 14px; line-height: 1.75; color: #222222; overflow-wrap: break-word; width: 53%; background-color: #f2f4f7; font-weight: bold;">本周完成工作</th>
        <th scope="col" width="29%" style="border: 1px solid #555555; padding: 12px; vertical-align: top; text-align: left; font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', SimSun, Arial, sans-serif; font-size: 14px; line-height: 1.75; color: #222222; overflow-wrap: break-word; width: 29%; background-color: #f2f4f7; font-weight: bold;">下周计划</th>
        </tr>
      </thead>
      <tbody>
      <tr>
        <td width="18%" style="border: 1px solid #555555; padding: 12px; vertical-align: top; text-align: left; font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', SimSun, Arial, sans-serif; font-size: 14px; line-height: 1.75; color: #222222; overflow-wrap: break-word; width: 18%;">具体项目名称</td>
        <td width="53%" style="border: 1px solid #555555; padding: 12px; vertical-align: top; text-align: left; font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', SimSun, Arial, sans-serif; font-size: 14px; line-height: 1.75; color: #222222; overflow-wrap: break-word; width: 53%;">
          <p style="margin: 0; padding: 0;">1、本周实际工作内容及成果（保留真实进度、问题和完成状态）。</p>
        </td>
        <td width="29%" style="border: 1px solid #555555; padding: 12px; vertical-align: top; text-align: left; font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', SimSun, Arial, sans-serif; font-size: 14px; line-height: 1.75; color: #222222; overflow-wrap: break-word; width: 29%;">
          <p style="margin: 0; padding: 0;">1、承接本周进度的具体下周任务。</p>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
